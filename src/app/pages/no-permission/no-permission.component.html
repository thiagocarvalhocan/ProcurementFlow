<p-toast></p-toast>

<div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <h2 class="mt-4 text-center text-[25px] font-normal leading-9 tracking-tight text-gray-900">
        {{message}}
    </h2>
</div>

<div class="flex flex-col gap-2 mt-6 text-center">
    <p-button (click)="onGoHome()" label="Go to start" size="small"
        styleClass="w-5/6  bg-[#0F4C5C] hover:bg-[#79161a] border-[#0F4C5C]"></p-button>
    <p-button [outlined]="true" (click)="onLogout()" label="Sign out" size="small"
        styleClass="w-5/6 hover:bg-[#0F4C5C0f] text-[#0F4C5C] border-[#0F4C5C]"></p-button>
</div>
